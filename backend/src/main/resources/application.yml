server:
  port: ${SERVER_PORT:8080}
  # Honor X-Forwarded-* from nginx/Docker so rate limiting sees the real client IP
  forward-headers-strategy: native

spring:
  application:
    name: campusconnect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 60MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  security:
    lockout-max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:5}
  jwt:
    secret: ${JWT_SECRET:campusconnect-dev-secret-key-change-in-production-must-be-256-bits-long}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://*.trycloudflare.com}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${UPLOAD_MAX_BYTES:26214400}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.springframework.security: INFO
    com.campusconnect: DEBUG
