# Tests run against in-memory H2 (MySQL mode); the schema comes from the entities, not Flyway.
spring:
  datasource:
    url: jdbc:h2:mem:campusconnect;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

app:
  upload:
    dir: ${java.io.tmpdir}/campusconnect-test-uploads
  security:
    lockout-max-attempts: 5
    lockout-duration-minutes: 15
    login-rate-limit-per-minute: 100

logging:
  level:
    com.campusconnect: INFO
    org.hibernate.SQL: WARN