services:
  mysql:
    image: mysql:8.4
    container_name: campusconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campusconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: campusconnect-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campusconnect
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: campusconnect-docker-secret-change-me-256bits-min-length-ok
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      UPLOAD_DIR: /app/uploads
      SPRING_PROFILES_ACTIVE: dev
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls same origin /api which nginx proxies to backend
        VITE_API_BASE_URL: /api
    container_name: campusconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  uploads_data:
